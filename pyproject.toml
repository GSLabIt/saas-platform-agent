[project]
name = "relay-agent"
version = "0.11.3"
description = "Open-source outbound-only agent for remote Docker/filesystem/Postgres operations (BYOI mode) — control-plane agnostic"
requires-python = ">=3.12"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.11.3"
tag_format = "v$version"
version_scheme = "semver"
update_changelog_on_bump = false
pre_bump_hooks = ["scripts/finalize-changelog.sh"]
version_files = [
    "pyproject.toml:version",
]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
# E501 is handled by ruff-format where possible; long strings/comments are left as-is
extend-ignore = ["E501"]
